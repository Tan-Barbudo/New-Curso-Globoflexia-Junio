name: Validar cambios
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: node scripts/generate-icons.mjs
      - run: npm run build
      - run: test -s dist/icon-192.png && test -s dist/icon-512.png && test -s dist/manifest.webmanifest && test -s dist/sw.js
